
services:
  exam-service:
    image: priyankakora/docker-endexam-2400031787:latest
    build:
      context: ./CrudServiceProject
      dockerfile: Dockerfile
    container_name: exam-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/soa-endexam-2400031787
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: exam123
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SHOULD_UNREGISTER_ON_SHUTDOWN: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
    networks:
      - microservices-network

networks:
  microservices-network:
    external: true
    name: microservices-deployment_microservices-network

